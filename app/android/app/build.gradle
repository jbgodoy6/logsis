plugins { id 'com.android.application' }

android {
    namespace 'br.com.sistel.logsis'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.sistel.logsis'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'SITE_URL', '"https://logsis.com.br/"'
        def authUrl = providers.gradleProperty('technicianAuthUrl').orElse('').get()
        if (!(authUrl == '' || authUrl.matches('https://script\\.google\\.com/macros/s/[A-Za-z0-9_-]+/exec'))) {
            throw new GradleException('technicianAuthUrl deve ser a URL HTTPS de implantação do serviço técnico.')
        }
        buildConfigField 'String', 'TECH_AUTH_URL', '"' + authUrl + '"'
        buildConfigField 'String', 'TECH_REGISTRY_ID', '"17HCp2CX3eUZXqQsTkTNDZvrLkGqzZQrJkCfeHo-toPQ"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix '.avaliacao'
            versionNameSuffix '-avaliacao'
        }
        release {
            minifyEnabled false
            // Production signing is configured by the app owner before distribution.
        }
    }
}

android {
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
