plugins { id 'com.android.application' }

android {
    namespace 'br.com.sistel.logsis'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.sistel.logsis'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'SITE_URL', '"https://logsis.com.br/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // Production signing is configured by the app owner before distribution.
        }
    }
}

android {
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
