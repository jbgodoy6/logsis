; Rede local do D-Max. Reinicie o programa após alterar.
[web]
; 0.0.0.0 permite acesso de outros computadores. 127.0.0.1 limita a este PC.
host = 0.0.0.0
porta = 8080
; auto usa dmax-<identificador>.local. Exemplo de nome personalizado: dmax-garagem
nome = auto
; Nome .local usa mDNS e depende de a rede permitir multicast.
anunciar = true
